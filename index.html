.nv{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}.nv .links{flex:none;margin:0 auto;background:#fff;border:1.5px solid var(--bd);border-radius:99px;padding:4px;gap:2px}.top .links a{padding:8px 16px;transition:.15s}.top .links a:hover{background:var(--p);box-shadow:none}.top .links a.on{background:var(--li);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.nr{display:flex;align-items:center;gap:10px}.ib{position:relative;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--bd);background:#fff;display:grid;place-items:center;color:var(--ink);transition:.15s}.ib:hover{border-color:var(--ink);transform:translateY(-1px)}.dt{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--co);border:2px solid #fff}.av{width:40px;height:40px;border-radius:50%;background:var(--pk);border:2px solid var(--ink);display:grid;place-items:center;font-weight:800}.xp{font-size:.72rem;font-weight:800;letter-spacing:.06em;padding:6px 12px;border-radius:99px;background:var(--p);border:1.5px dashed var(--ink)}
.bn a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mu)}.bn a.on{color:var(--bl);box-shadow:inset 0 3px 0 var(--co)}
.ft{margin-top:56px;border-top:2px solid var(--ink);background:#fff;padding:48px 0 24px}.fg{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:28px}.fg nav{display:flex;flex-direction:column;gap:8px}.fg nav a{color:#45443f;font-weight:600}.fg nav a:hover{color:var(--bl)}.wr{margin:32px 0 8px}.wr svg{width:100%;height:auto;display:block;overflow:visible}
.wrc{width:0}.mk{opacity:0}.go .wrc{animation:wr 2.6s cubic-bezier(.55,.05,.3,1) forwards}.go .mk{animation:mkx 2.6s cubic-bezier(.55,.05,.3,1) forwards,mkf 2.6s forwards}.go .mw{animation:wob .5s ease-in-out 5}

@media(max-width:1000px){.xp{display:none}}
@media(max-width:860px){.sec{padding:44px 0}.hero{padding:32px 0}.stage{min-height:0;display:flex;flex-direction:column;gap:14px}.stage>*{position:static!important;width:100%!important;transform:none!important}.stage>.hand{width:auto!important}.side{grid-template-columns:1fr!important}.cv{padding:12px}.nv{height:58px}.fg{grid-template-columns:1fr 1fr}.fg>div:first-child{grid-column:1/-1}}

@media(prefers-reduced-motion:reduce){.wrc{width:900px}.mk{display:none}}
.skip{position:absolute;left:-999px;top:8px}.skip:focus{left:12px;z-index:99;background:#fff;padding:8px 14px;border:2px solid var(--ink);border-radius:8px;font-weight:800}main:focus{outline:none}.chip{min-height:40px}
@media(max-width:1000px){.top .links a{padding:8px 11px;font-size:.88rem}}
@media(max-width:860px){.btn.s{min-height:44px}.cv .hand{position:static!important;display:block;margin-bottom:6px}.side aside{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.side aside a,.side aside .lab{white-space:nowrap;flex:none;align-self:center}}

</style></head><body><div id="root"></div><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let S=L('sk3',{xp:1240,done:[],likes:{},com:{},rem:[],name:'Alex',bio:'Designer-in-progress. Learning by making.',sk:{'Visual Design':75,'UX Research':45,'Prototyping':60,'Typography':85,'Interaction Design':50}});
const save=()=>{try{localStorage.setItem('sk3',JSON.stringify(S))}catch(e){}};
const CO=['#5B6CFF','#FF775E','#D9FF70','#FF9BCB','#87D8FF'];
const M=[{id:1,t:'Fix this checkout',c:'UI/UX Design',d:'Beginner',m:20,x:100,s:'Prototyping',p:'Learn how to improve a confusing checkout experience.'},{id:2,t:'Build a landing page hero',c:'Web Design',d:'Intermediate',m:35,x:150,s:'Visual Design',p:'Learn headline hierarchy, layout, and visual storytelling.'},{id:3,t:'Give this poster a glow-up',c:'Graphic Design',d:'Beginner',m:25,x:120,s:'Typography',p:'Practice typography, composition, and color.'},{id:4,t:'Make an AI assistant useful',c:'AI Product Design',d:'Intermediate',m:40,x:180,s:'Interaction Design',p:'Design a helpful interaction for an AI-powered product.'}];
const CAT=['UI/UX Design','Web Development','Artificial Intelligence','Graphic Design','Motion Design','Product Management','Digital Marketing','3D and Illustration'];
const CRS=[{id:1,t:'UI/UX Design Foundations',c:'UI/UX Design',d:'Beginner',m:240,l:'Turn confusing interfaces into experiences people understand.'},{id:2,t:'Build Your First Website',c:'Web Development',d:'Beginner',m:300,l:'Ship a real page with HTML, CSS and a little JavaScript.'},{id:3,t:'Visual Design Playground',c:'Graphic Design',d:'Intermediate',m:180,l:'Color, type and composition through quick experiments.'},{id:4,t:'AI Product Builder',c:'Artificial Intelligence',d:'Intermediate',m:210,l:'Design useful, honest AI-powered interactions.'},{id:5,t:'Motion Basics',c:'Motion Design',d:'Beginner',m:120,l:'Easing, timing and storytelling in motion.'},{id:6,t:'Product Thinking 101',c:'Product Management',d:'Advanced',m:150,l:'Frame problems, prioritise and measure what matters.'}];
const SYL=['Understand the user','Map the experience','Visual hierarchy','Design better forms','Build your first prototype'];
const PR=[{id:1,t:'Minimal coffee shop website',b:'Maya',c:'UI/UX Design',d:'A calm, type-led homepage for a neighbourhood café.'},{id:2,t:'A better mobile checkout',b:'Jordan',c:'Product Design',d:'Three taps shorter, with clearer error recovery.'},{id:3,t:'Music poster experiment',b:'Sam',c:'Graphic Design',d:'Big type, two colors, and one loud shape.'},{id:4,t:'Weather app concept',b:'Alex',c:'Web Development',d:'Glanceable forecast with a friendly tone.'}];
const BG=[['First Mission','✎'],['Curious Creator','?'],['Feedback Friend','♥'],['Remix Explorer','↻'],['Project Finisher','★']];
const ar=(c='#FF775E',w=90)=>`<svg class="draw" width="${w}" height="50" viewBox="0 0 90 50" fill="none" aria-hidden="true"><path d="M4 8C30 -2 70 8 76 36M76 36l-12-6M76 36l8-12" stroke="${c}" stroke-width="4" stroke-linecap="round"/></svg>`;
const ul=(c='#FF775E')=>`<svg class="draw" viewBox="0 0 300 14" preserveAspectRatio="none" style="display:block;width:100%;height:12px;margin-top:-6px" aria-hidden="true"><path d="M3 9C60 2 120 12 190 6S280 4 297 8" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;
const star=(c='#FF775E',s=34)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 3l4 12 13 1-10 8 4 13-11-7-11 7 4-13L3 16l13-1z" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
function th(i,t){const c=CO[i%5],c2=CO[(i+2)%5];const sh=[`<circle cx="80" cy="40" r="26" fill="${c2}" stroke="#202124" stroke-width="2"/><rect x="14" y="14" width="46" height="8" rx="4" fill="#202124"/><rect x="14" y="28" width="30" height="5" rx="2" fill="#fff"/>`,`<rect x="14" y="48" width="18" height="22" fill="#fff" stroke="#202124" stroke-width="2"/><rect x="40" y="30" width="18" height="40" fill="${c2}" stroke="#202124" stroke-width="2"/><rect x="66" y="14" width="18" height="56" fill="#202124"/>`,`<path d="M10 60C30 10 60 70 110 20" stroke="#202124" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="30" cy="22" r="10" fill="${c2}" stroke="#202124" stroke-width="2"/>`,`<rect x="14" y="12" width="92" height="56" rx="8" fill="#fff" stroke="#202124" stroke-width="2"/><rect x="22" y="22" width="50" height="9" rx="4" fill="${c2}"/><rect x="22" y="38" width="74" height="5" rx="2" fill="#E8E5DC"/><rect x="22" y="48" width="40" height="10" rx="5" fill="#202124"/>`][i%4];return`<div class="th" role="img" aria-label="${t}" style="background:${c}"><svg viewBox="0 0 120 80" preserveAspectRatio="xMidYMid slice">${sh}</svg></div>`}
const lvl=()=>Math.floor(S.xp/500)+1,tk=m=>m<60?m+' min':Math.round(m/60)+' hrs';
let C={fs:24,fw:400,lh:2,al:'center',ff:'Georgia,serif'};
const C0={...C};
function cv(){return`<div class="cv"><div><span class="lab">Your mission</span><p style="font-weight:600;margin-top:4px">Make the headline easier to read. Start by changing its size and line height.</p><div id="cc"><label for="fs">Font size <b id="fsv">${C.fs}px</b></label><input id="fs" type="range" min="16" max="64" value="${C.fs}"><label for="fw">Font weight <b id="fwv">${C.fw}</b></label><input id="fw" type="range" min="300" max="800" step="100" value="${C.fw}"><label for="lh">Line height <b id="lhv">${C.lh}</b></label><input id="lh" type="range" min="1" max="2.2" step=".05" value="${C.lh}"><label for="al">Alignment</label><select id="al"><option>left</option><option>center</option><option>right</option></select><label for="ff">Font family</label><select id="ff"><option value="Georgia,serif">Serif</option><option value="'Plus Jakarta Sans',sans-serif">Sans</option><option value="monospace">Mono</option></select></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn s" data-a="chk">Check my work <i>→</i></button><button class="btn s g" data-a="rst">Reset</button></div></div><div style="position:relative"><div class="lab" style="margin-bottom:6px">● ● ● &nbsp;sunnyday.co</div><div class="pv" id="pv"><h3 id="ph" style="font-size:${C.fs}px;font-weight:${C.fw};line-height:${C.lh};text-align:${C.al};font-family:${C.ff}">Our small studio helps growing teams to maybe get a bit better at how they present things online</h3><p style="text-align:${C.al}" class="mu">Book a call to see how we work.</p></div><span class="hand" style="position:absolute;right:6px;top:-30px">make this clearer! ↓</span><div class="fb" id="fb" role="status" aria-live="polite" hidden></div></div></div>`}
function cvEvents(){const set=()=>{C.fs=+$('#fs').value;C.fw=+$('#fw').value;C.lh=+$('#lh').value;C.al=$('#al').value;C.ff=$('#ff').value;$('#fsv').textContent=C.fs+'px';$('#fwv').textContent=C.fw;$('#lhv').textContent=C.lh;const h=$('#ph');h.style.cssText=`font-size:${C.fs}px;font-weight:${C.fw};line-height:${C.lh};text-align:${C.al};font-family:${C.ff}`;$('#pv p').style.textAlign=C.al};$('#cc').addEventListener('input',set);$('#al').value=C.al;$('#ff').value=C.ff}
function score(){let s=0,t=[];if(C.fs>=32)s++;else t.push('a bigger size');if(C.lh<=1.35&&C.lh>=1.05)s++;else t.push('a tighter line height (around 1.2)');if(C.fw>=600)s++;else t.push('a bolder weight');if(C.al==='left')s++;else t.push('left alignment for easier scanning');return{s,t}}
function chk(){const r=score(),f=$('#fb');f.hidden=false;f.textContent=r.s>=4?'Great work! Your heading is easy to scan from the first glance.':r.s>=2?'Nice improvement! Your heading is easier to scan. Try '+r.t[0]+' for an even cleaner result.':'Good start. Messy first drafts welcome — try '+r.t.slice(0,2).join(' and ')+'.';return r.s}
const navOld=(a)=>`<nav class="top"><div class="w"><a href="#/" class="logo">SKETCH<svg class="draw" viewBox="0 0 100 8" preserveAspectRatio="none"><path d="M2 5C30 1 60 7 98 3" stroke="#FF775E" stroke-width="3" fill="none" stroke-linecap="round"/></svg></a><div class="links">${[['Explore','explore'],['Missions','mission/1'],['Community','community'],['Skill Map','skills']].map(([n,h])=>`<a href="#/${h}" class="${a===h.split('/')[0]?'on':''}">${n}</a>`).join('')}</div><span style="flex:1" class="show-m"></span><a href="#/dash" class="hide-m" aria-label="Dashboard"><span class="lab">LV ${lvl()} · ${S.xp} XP</span></a><a href="#/showcase" aria-label="My profile" style="width:38px;height:38px;border-radius:50%;background:var(--pk);border:2px solid var(--ink);display:grid;place-items:center;font-weight:800">${S.name[0]}</a><a href="#/dash" class="btn s hide-m">Start creating</a></div></nav><div class="bn">${[['Home','/'],['Learn','dash'],['Explore','explore'],['Make','mission/1'],['Crowd','community']].map(([n,h])=>`<a href="#/${h==='/'?'':h}" class="${a===h.split('/')[0]?'on':''}">${n}</a>`).join('')}</div>`;

else if(a==='mk'){const p=PR.find(x=>x.id==i);S.rem.push({id:Date.now(),t:p.t+' (remix)',c:p.c,of:p.id});save();$('#ov').innerHTML='';tz('Remix created — find it in your showcase.');go('#/showcase')}
else if(a==='edit'){modal(`<h2 style="font-size:1.6rem">Edit profile</h2><form id="pf" class="f" style="display:block"><label for="pn" class="lab">Name</label><input id="pn" value="${S.name}"><label for="pb" class="lab" style="margin-top:8px;display:block">Bio</label><textarea id="pb" rows="3">${S.bio}</textarea><p id="pe" role="alert" style="color:#c0391f;margin:6px 0"></p><button class="btn" type="submit">Save</button></form>`);$('#pf').onsubmit=ev=>{ev.preventDefault();const n=$('#pn').value.trim();if(!n)return $('#pe').textContent='Name can\'t be empty.';S.name=n;S.bio=$('#pb').value;save();$('#ov').innerHTML='';tz('Profile updated.');route()}}});
const ic=d=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I={home:'<path d="M3 11l9-8 9 8v10H3z"/>',ex:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',ms:'<path d="M12 2l3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z"/>',cm:'<path d="M4 4h16v12H8l-4 4z"/>',sk:'<circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M8 16l8-8"/>',bell:'<path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 21h4"/>'};
const nav=a=>`<a class="skip" href="#" onclick="event.preventDefault();document.querySelector('main').focus()">Skip to content</a><nav class="top" aria-label="Main"><div class="w nv"><a href="#/" class="logo" aria-label="SKETCH home">SKETCH<svg class="draw" viewBox="0 0 100 8" preserveAspectRatio="none"><path d="M2 5C30 1 60 7 98 3" stroke="#FF775E" stroke-width="3" fill="none" stroke-linecap="round"/></svg></a><div class="links">${[['Explore','explore'],['Missions','mission'],['Community','community'],['Skill Map','skills']].map(([n,h])=>`<a href="#/${h==='mission'?'mission/1':h}" class="${a===h?'on':''}" ${a===h?'aria-current="page"':''}>${n}</a>`).join('')}</div><div class="nr"><a href="#/dash" class="xp">LV ${lvl()} · ${S.xp} XP</a><button class="ib" data-n="s" aria-label="Search">${ic(I.ex)}</button><button class="ib" data-n="b" aria-label="Notifications, 2 new">${ic(I.bell)}<i class="dt"></i></button><a href="#/showcase" class="av" aria-label="My profile">${S.name[0]}</a><a href="#/dash" class="btn s hide-m">Start creating <i>→</i></a></div></div></nav><div class="bn">${[['Home','dash','home'],['Explore','explore','ex'],['Missions','mission/1','ms'],['Community','community','cm'],['Skills','skills','sk']].map(([n,h,i])=>`<a href="#/${h}" class="${a===h.split('/')[0]?'on':''}">${ic(I[i])}${n}</a>`).join('')}</div>`;
const foot=`<footer class="ft"><div class="w"><div class="fg"><div><a href="#/" class="logo">SKETCH</a><p class="mu" style="margin-top:10px">Learn something. Try it yourself. Make something real.</p><span class="hand">messy first drafts welcome</span></div>${[['Learn',[['Explore','explore'],['Missions','mission/1'],['Courses','course/1']]],['Make',[['Learning Canvas','mission/3'],['Skill Map','skills'],['Dashboard','dash']]],['Share',[['Community','community'],['My showcase','showcase']]]].map(([h,l])=>`<nav aria-label="${h}"><b class="lab">${h}</b>${l.map(([n,x])=>`<a href="#/${x}">${n}</a>`).join('')}</nav>`).join('')}</div><div id="ftw" class="wr"><svg viewBox="0 0 900 250" role="img" aria-label="SKETCH, written in marker"><defs><clipPath id="wc"><rect class="wrc" x="0" y="0" height="250"/></clipPath></defs><g clip-path="url(#wc)"><text x="10" y="200" textLength="880" lengthAdjust="spacingAndGlyphs" font-family="Plus Jakarta Sans,sans-serif" font-weight="800" font-size="210" fill="#202124">SKETCH</text><path d="M20 228C200 214 420 238 880 222" stroke="#FF775E" stroke-width="9" fill="none" stroke-linecap="round"/></g><g class="mk"><g class="mw"><g transform="translate(0,150) rotate(30)"><rect x="-9" y="-80" width="18" height="76" rx="3" fill="#5B6CFF" stroke="#202124" stroke-width="3"/><path d="M-9 -4L0 14L9 -4z" fill="#FF775E" stroke="#202124" stroke-width="3" stroke-linejoin="round"/></g></g></g></svg></div><p class="lab" style="text-align:center;margin:0">© 2026 SKETCH</p></div></footer>`;
function fw(){const e=$('#ftw');if(!e)return;new IntersectionObserver(en=>en.forEach(x=>{if(x.isIntersecting){e.classList.remove('go');void e.offsetWidth;e.classList.add('go')}else e.classList.remove('go')}),{threshold:.6}).observe(e)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;if(b.dataset.n==='s'){modal(`<h2 style="font-size:1.6rem">Search SKETCH</h2><form id="sf" class="f" style="display:block"><label class="lab" for="sq">Search courses</label><input id="sq" placeholder="e.g. typography" value="${F.q}"><button class="btn" style="margin-top:12px" type="submit">Search <i>→</i></button></form>`);setTimeout(()=>{const q=$('#sq');q&&q.focus()},40)}else modal(`<h2 style="font-size:1.6rem">Notifications</h2><p><b>Maya</b> left a note on your weather concept.</p><p><b>New mission</b> unlocked: Fix this confusing mobile flow.</p><p class="mu">That's everything. Small steps, real skills.</p><button class="btn s g" data-a="cls">Close</button>`)});
document.addEventListener('submit',e=>{if(e.target.id!=='sf')return;F.q=$('#sq').value.trim();$('#ov').innerHTML='';go('#/explore')});
addEventListener('keydown',e=>{if(e.key!=='Tab')return;const d=document.querySelector('#ov [role=dialog]');if(!d)return;const f=[...d.querySelectorAll('button,input,textarea,select,a[href]')];if(!f.length)return;const a=f[0],z=f[f.length-1],c=document.activeElement;if(e.shiftKey&&(c===a||c===d)){e.preventDefault();z.focus()}else if(!e.shiftKey&&c===z){e.preventDefault();a.focus()}});
let HH=location.hash||'#/';
function go(h){HH=h;try{history.pushState(null,'',h)}catch(e){}route()}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button)return;e.preventDefault();go(a.getAttribute('href'))});
route();
